name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for the database tests.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: life200
          POSTGRES_PASSWORD: life200
          POSTGRES_DB: life200
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life200"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
